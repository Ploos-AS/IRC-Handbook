name: Minimal IRC bot

on:
  push:
    paths:
      - "examples/minimal-bot/**"
      - ".github/workflows/minimal-bot.yml"
  pull_request:
    paths:
      - "examples/minimal-bot/**"
      - ".github/workflows/minimal-bot.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit and integration tests
        working-directory: examples/minimal-bot
        run: python -m unittest -v
